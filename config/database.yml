# PostgreSQL database configuration.
# Railway provides DATABASE_URL when PostgreSQL is attached.
# Set DATABASE_URL in the local .env file for development.

default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  url: <%= ENV["DATABASE_URL"] %>

development:
  <<: *default
  database: kurva_api_development

test:
  <<: *default
  database: kurva_api_test

production:
  <<: *default
